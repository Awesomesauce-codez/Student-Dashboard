<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1000px;margin:auto;padding:32px 20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;border:1px solid #e5e9f2;border-radius:14px;padding:18px;margin-bottom:16px}.toolbar{display:flex;gap:10px;margin:12px 0}.toolbar>*{padding:10px;border:1px solid #ddd;border-radius:9px}.toolbar input{flex:1}.assignment{display:flex;gap:12px;align-items:center;border-top:1px solid #eee;padding:14px 0}.main{flex:1}.muted{color:#687386;font-size:13px}.done{text-decoration:line-through;opacity:.5}.overdue{color:#dc2626;font-weight:700}button{padding:10px 14px;border:0;border-radius:9px;cursor:pointer;background:#4f46e5;color:white;font-weight:700}.delete{background:#eef0f7;color:#333}.progress{height:9px;background:#eee;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#4f46e5}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><h1>Student Dashboard</h1><p class="muted">Assignments, deadlines, and progress in one place.</p><div class="grid"><div class="card"><b>Total</b><h2 id="total">0</h2></div><div class="card"><b>Due this week</b><h2 id="week">0</h2></div><div class="card"><b>Completed</b><h2 id="completed">0</h2></div><div class="card"><b>Overdue</b><h2 id="overdue">0</h2></div></div><section class="card"><button onclick="addAssignment()">+ Add assignment</button><div class="toolbar"><input id="search" placeholder="Search assignments or classes" oninput="render()"><select id="filter" onchange="render()"><option value="all">All</option><option value="active">Active</option><option value="completed">Completed</option><option value="overdue">Overdue</option></select></div><div id="list"></div></section><section class="card"><b>Progress</b><p id="pct">0%</p><div class="progress"><div id="bar" style="width:0"></div></div></section></main><script>const key='student-dashboard';let a=JSON.parse(localStorage.getItem(key)||'[]');function save(){localStorage.setItem(key,JSON.stringify(a));render()}function days(n){let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function addAssignment(){let name=prompt('Assignment name:');if(!name)return;let cls=prompt('Class:')||'Other';let date=prompt('Due date (YYYY-MM-DD):',days(1));if(!date)return;a.push({id:Date.now(),name,cls,date,done:false});save()}function toggle(id){let x=a.find(x=>x.id===id);x.done=!x.done;save()}function removeA(id){a=a.filter(x=>x.id!==id);save()}function render(){let now=new Date(),end=new Date();end.setDate(now.getDate()+7),q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;let overdue=a.filter(x=>!x.done&&new Date(x.date+'T23:59:59')<now).length,week=a.filter(x=>!x.done&&new Date(x.date+'T23:59:59')>=now&&new Date(x.date+'T23:59:59')<=end).length,done=a.filter(x=>x.done).length;total.textContent=a.length;document.getElementById('week').textContent=week;completed.textContent=done;document.getElementById('overdue').textContent=overdue;let p=a.length?Math.round(done/a.length*100):0;pct.textContent=p+'%';bar.style.width=p+'%';let rows=a.filter(x=>{let od=!x.done&&new Date(x.date+'T23:59:59')<now;return(!q||(x.name+' '+x.cls).toLowerCase().includes(q))&&(f==='all'||f==='active'&&!x.done||f==='completed'&&x.done||f==='overdue'&&od)}).sort((x,y)=>x.date.localeCompare(y.date));list.innerHTML=rows.length?rows.map(x=>{let od=!x.done&&new Date(x.date+'T23:59:59')<now;return '<div class="assignment"><input type="checkbox" '+(x.done?'checked':'')+' onchange="toggle('+x.id+')"><div class="main '+(x.done?'done':'')+'"><b>'+escapeHtml(x.name)+'</b><div class="muted">'+escapeHtml(x.cls)+' · Due '+x.date+'</div></div><span class="'+(od?'overdue':'')+'">'+(od?'Overdue':'')+'</span><button class="delete" onclick="removeA('+x.id+')">×</button></div>'}).join(''):'<p class="muted">No assignments yet.</p>'}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();</script></body></html>
